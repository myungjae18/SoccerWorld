<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta id="_csrf" name="_csrf" th:content="${_csrf.token}"/>
    <meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>내 정보</title>
    <!-- Bootstrap core CSS -->
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link href="/static/css/all.css" rel="stylesheet">
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
    />
    <!-- Custom styles for this template -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/main-style.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/myPage.css"/>
</head>
<body>
<input type="hidden" id="member-id" th:value="${#authentication.principal.memberId}"/>
<!-- Navigation -->
<nav th:insert="~{/fragments/fragments :: nav}"></nav>
<br>
<div class="container">
    <div class="row">
        <!--sidebar-->
        <th:block th:replace="~{member/sidebar :: sidebarFragment}"></th:block>
        <!--sidebar 끝-->
        <!-- 내 정보 -->
        <div class="main" th:if="${type.equals('info')}">
            <div class="main-header">
                내 정보
                <hr>
            </div>
            <div class="main-info">
                <form th:action="@{/member/{memberId}(memberId=${#authentication.principal.memberId})}"
                      method="#" th:method="PUT" th:object="${memberDto}">
                    <br>
                    <label>&nbsp;이름</label>
                    <input type="text" class="input-field" name="name"
                           th:value="${#authentication.principal.name}"/><br><br>
                    <label>&nbsp;id</label>
                    <input type="text" class="input-field" th:value="${#authentication.principal.username}"
                           readonly/><br><br>
                    <label>&nbsp;닉네임</label>
                    <input type="text" class="input-field"
                           th:value="${#authentication.principal.nickname}" readonly/>
                    &nbsp;&nbsp;<button type="button" th:onclick="|location.href='@{/member/info(type=changeNick)}'|">
                    변경
                </button>
                    <br><br>
                    <label>&nbsp;현재 포인트 </label>
                    <input type="text" class="input-field" th:value="${#authentication.principal.point}"
                           readonly/><br><br>
                    <label>&nbsp;Phone</label>
                    <input type="text" class="input-field" name="phone"
                           th:value="${#authentication.principal.phone}"/><br><br>
                    <label>&nbsp;응원 팀</label>
                    <input type="text" class="input-field" th:value="${#authentication.principal.teamDto.name}"
                           readonly/>
                    &nbsp;&nbsp;<button type="button" th:onclick="|location.href='@{/member/info(type=changeTeam)}'|">
                    변경
                </button>
                    <br><br>
                    <input hidden th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button>수정</button>
                    <button type="button" onclick="edit('delete')">탈퇴</button>
                </form>
            </div>
        </div>
        <!-- 내 정보 끝 -->
        <!-- 닉네임 변경 -->
        <div class="main" th:if="${type}=='changeNick'">
            <div class="main-header">
                닉네임 변경
                <hr>
            </div>
            <div class="main-info">
                <br>
                <label>&nbsp;현재 닉네임</label>
                <label th:text="${#authentication.principal.nickname}"></label>
                <br><br>
                <label>&nbsp;새 닉네임</label>
                <input type="text" class="input-field" name="nickname" id="nickname" required minlength="2"/>
                &nbsp;<button type="button" onclick="duplicationCheck()">중복 확인</button>
                <input hidden th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input hidden th:name="_method" value="PATCH"/>
                <br><br>
                <label></label>
                <button type="button" onclick="submitPatch('nickname')">변경</button>
                <br><br>
            </div>
        </div>
        <!-- 닉네임 변경 끝 -->
        <!-- 비밀번호 변경 -->
        <div class="main" th:if="${type}=='changePw'">
            <div class="main-header">
                비밀번호 변경
                <hr>
            </div>
            <div class="main-info">
                <!--      <form th:action="@{/member/{memberId}(memberId=${#authentication.principal.memberId})}"-->
                <!--            th:method="patch" th:object="${memberDto}" id="form-password">-->
                <br>
                <label>&nbsp;새 비밀번호</label>
                <input type="password" class="input-field" id="new-password"/>
                <br><br>
                <label>&nbsp;비밀번호 확인</label>
                <input type="password" class="input-field" id="password-check"/>
                <br><br>
                <label></label>
                <button type="button" onclick="compare()">변경</button>
                <br><br>
                <!--      </form>-->
            </div>
        </div>
        <!-- 비밀번호 변경 끝 -->
        <!-- 응원 팀 변경 -->
        <div class="main" th:if="${type}=='changeTeam'">
            <div class="main-header">
                응원 팀 변경
                <hr>
            </div>
            <div class="league-list">
                <div class="team-box"></div>
                <div class="team-box">현재 응원 팀</div>
                <div class="team-box">
                    <label th:text="${#authentication.principal.teamDto.name}"></label>
                    <img th:src="${#authentication.principal.teamDto.logo}"/>
                </div>
                <div class="team-box"></div>
            </div>
            <div class="league-list">
                <div class="team-box filter-button" data-league="Premier League">
                    <label>EPL</label>
                    <img src="/static/images/pl-logo.png" width="64" height="64"/>
                </div>
                <div class="team-box filter-button" data-league="Primera Division">
                    <label>LA LIGA</label>
                    <img src="/static/images/ll-logo.png" width="64" height="64"/>
                </div>
                <div class="team-box filter-button" data-league="Serie A">
                    <label>SERIE A</label>
                    <img src="/static/images/sa-logo.png" width="64" height="64"/>
                </div>
                <div class="team-box filter-button" data-league="Bundesliga">
                    <label>BUNDESLIGA</label>
                    <img src="/static/images/bl-logo.png" width="64" height="64"/>
                </div>
                <div class="team-box">
                    <label>팀 없음</label>
                    <img src="/static/images/x.png" width="64" height="64" />
                </div>
            </div>
            <div class="league-list">
                <div th:each="teamDto : ${teamList}" class="team-box team-div"
                     th:data-league="${teamDto.league}" style="display: none;"
                     th:onclick="|location.href='/team/info?team-id='+${teamDto.teamId};|">
                    <img th:src="${teamDto.logo}" width="64" />
                    <label th:text="${teamDto.name}"/>
                </div>
            </div>
            <br>
            <div class="main-info">
                <input type="hidden" name="_method" value="patch"/>
                <button>변경</button>
                <br><br>
            </div>
        </div>
        <!-- 응원 팀 변경 끝 -->
        <!-- 주문 내역 -->
        <div class="main" th:if="${type}=='prediction'">
            <div class="main-header">
                내 승부 예측 결과
            </div>
            <div class="main-info">
                <table>
                    <thead>
                        <tr>
                            <th></th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <!-- 주문 내역 끝 -->
    </div>
</div>
<script src="/static/js/info.js"></script>
<script th:inline="javascript">
    let message = [[${message}]]; //controller에서 날린 request 객체에 담긴 메세지

    if (message != null) {
        alert(message);
    }
</script>
</body>
</html>
