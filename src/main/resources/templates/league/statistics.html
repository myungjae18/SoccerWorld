<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>리그 및 선수 순위</title>
    <!-- Bootstrap core CSS (Bootstrap 5) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">
    <!-- Custom styles -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/main-style.css" rel="stylesheet">
</head>
<body>

<!-- 네비게이션 바 -->
<nav th:insert="~{/fragments/fragments :: nav}"></nav>
<div class="container">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title">리그 순위</h3>
                    <div>
                        <a href="#" id="leagueButton" class="btn btn-primary" onclick="showLeagueRanking()">리그 순위</a>
                        <a href="#" id="playerButton" class="btn btn-secondary" onclick="showPlayerRanking()">선수 순위</a>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row justify-content-end align-items-center mb-3">
                        <div class="col-lg-4 d-flex justify-content-end">
                            <div class="dropdown me-2">
                                <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownSeasonButton"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                    시즌 선택
                                </button>
                                <ul class="dropdown-menu" id="seasonDropdown" aria-labelledby="dropdownSeasonButton">
                                </ul>
                            </div>

                            <div class="dropdown" id="leagueComboBox">
                                <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                    리그 선택
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changeLeague('PL')">EPL</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changeLeague('PD')">LA LIGA</a></li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changeLeague('SA')">SERIE A</a></li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changeLeague('BL1')">BUNDESLIGA</a></li>
                                </ul>
                            </div>

                            <div class="dropdown" id="playerComboBox" style="display:none;">
                                <button class="btn btn-primary dropdown-toggle" type="button"
                                        id="playerDropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                    리그 선택
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="playerDropdownMenuButton">
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changePlayerLeague('eplPlayerRanking', 'EPL')">EPL</a></li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changePlayerLeague('laligaPlayerRanking', 'LA LIGA')">LA LIGA</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changePlayerLeague('serieaPlayerRanking', 'SERIE A')">SERIE A</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                           onclick="changePlayerLeague('bundesligaPlayerRanking', 'BUNDESLIGA')">BUNDESLIGA</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 리그 순위 테이블 -->
                    <div id="leagueRanking">
                        <table class="ranking-table table table-striped">
                            <thead>
                            <tr>
                                <th>순위</th>
                                <th></th>
                                <th colspan="10">팀명</th>
                                <th>경기</th>
                                <th>승</th>
                                <th>무</th>
                                <th>패</th>
                                <th>득실</th>
                                <th>승점</th>
                            </tr>
                            </thead>
                            <tbody id="standings">
                            </tbody>
                        </table>
                    </div>

                    <!-- 선수 순위 테이블 (초기에는 숨김) -->
                    <div id="playerRanking" style="display: none;">
                        <table class="ranking-table table table-striped">
                            <thead>
                            <tr>
                                <th>순위</th>
                                <th>선수명</th>
                                <th>팀명</th>
                                <th>골</th>
                                <th>어시</th>
                                <th>공격포인트</th>
                            </tr>
                            </thead>
                            <tbody id="statistics">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap core JavaScript (Bootstrap 5) -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/leagueStandings.js"></script>
</body>
</html>
