  <script th:inline="javascript">
    function formatMatchDate(){
      document.querySelectorAll("span.match-date").forEach(function (element) {
        let rawDate = element.getAttribute("data-date"); // "2024-08-17 04:00:00"
        if (rawDate) {
          let dateObj = new Date(rawDate);
          let year = dateObj.getFullYear();
          let month = dateObj.getMonth() + 1; // 월은 0부터 시작하므로 +1
          let day = dateObj.getDate();
          let dayNames = ["일", "월", "화", "수", "목", "금", "토"];
          let dayOfWeek = dayNames[dateObj.getDay()]; // 요일 가져오기

          let hours = dateObj.getHours();
          let minutes = dateObj.getMinutes().toString().padStart(2, "0"); // 두 자리로 맞추기
          let period = hours < 12 ? "오전" : "오후"; // 오전/오후 구분
          hours = hours % 12 || 12; // 12시간제로 변환

          let formattedDate = `${year}. ${month}. ${day}. (${dayOfWeek}) ${period} ${hours}:${minutes}`;
          element.textContent = formattedDate;
        }
      });
    }
    document.addEventListener("DOMContentLoaded", function () {
      formatMatchDate();
    });

  </script>

<script>
  function handleClick(memberId, fixtureId, result, serverTime) {
    const clickedTime = new Date(); // 현재 시간 (버튼 클릭 시간)

    fetch('/security/isLoggedIn')
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(isLoggedIn => {
              if (!isLoggedIn) {
                alert("로그인 이후에 사용해주세요");
              } else {
                let formattedDateTime = serverTime.replace(" ", "T");
                let gameTime = new Date(formattedDateTime);
                console.log(isLoggedIn);
                selectTeam(memberId, fixtureId, result, gameTime);


              }
            })
            .catch(error => {
              console.error('There was a problem with the fetch operation:', error);
            });
  }

  // let isRequestPending = false;
  function selectTeam(memberId,gameId,result,gameTime) {
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    const token = document.querySelector('meta[name="_csrf"]').content;

    fetch('/prediction', { //스프링 시큐리티 사용하면 POST요청시 시큐리티 POSt요청은 CSRF보호를 하고있기 때문에 CSRF 토큰 설정을 해야 POST 요청가능
      method: 'POST',
      headers: {
        'Content-Type': 'application/json', // JSON 형식으로 설정
        [header] : token
      },
      body: JSON.stringify({
        gameId: gameId,
        result: result,
        memberId: memberId,
        gameTime: gameTime
      }),
    }).then(response => {
      if (response.ok) {  // 상태 코드가 200 OK일 경우
        return response.text();  // 응답 본문을 텍스트로 처리
      } else if (response.status === 400) {  // 상태 코드가 400 BAD_REQUEST일 경우
        return response.text();  // 응답 본문을 텍스트로 처리
      } else {
        throw new Error('알 수 없는 오류가 발생했습니다.');
      }
    }).then(data => {
      if (data === "성공") {
        alert('예측이 성공적으로 등록되었습니다.');
      } else if (data === "투표기간제한") {
        alert('투표기간이 아닙니다.');
      } else if (data === "재투표") {
        alert('이미 예측을 하셨습니다.');
      }
    })
            .catch(error => {
              console.error('There was a problem with the fetch operation:', error);
            })
            .finally(() => {
              window.location.reload();
            });

  }

</script>
